<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java & Spring Developer Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #0d1117; 
            color: white; 
            display: flex;
            margin: 0;
        }
        
        /* Sidebar Styling */
        .sidebar { 
            width: 300px; 
            background: #161b22; 
            padding: 30px; 
            height: 100vh; 
            position: fixed; 
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .sidebar img { 
            width: 140px; 
            border-radius: 50%; 
            margin-bottom: 15px; 
        }
        .sidebar h2 { 
            font-size: 2rem; 
            margin-bottom: 10px; 
        }
        .social-icons { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 20px; 
        }
        .social-icons a { 
            color: white; 
            font-size: 1.5rem; 
            text-decoration: none; 
        }
        .sidebar ul { 
            list-style: none; 
            padding: 0; 
            width: 100%; 
        }
        .sidebar ul li { 
            margin: 15px 0; 
            text-align: center; 
        }
        .sidebar ul li a { 
            color: white; 
            text-decoration: none; 
            display: block; 
            padding: 12px; 
            border-radius: 5px; 
            font-size: 1.2rem;
        }
        .sidebar ul li a:hover { 
            background: #21262d; 
        }
        
        /* Hero Section */
        .hero {
            margin-left: 300px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            text-align: left; 
            background: url('https://plus.unsplash.com/premium_photo-1710119487743-48959c984d45?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D') center/cover no-repeat; 
            flex-grow: 1;
            padding: 50px;
            backdrop-filter: brightness(0.7);
        }
        .hero-content {
            max-width: 600px;
        }
        .hero h1 { 
            font-size: 4rem; 
            font-weight: bold; 
            margin-bottom: 10px; 
        }
        .hero p { 
            font-size: 1.8rem; 
            font-weight: 300;
        }
        .dynamic-text { 
            border-bottom: 3px solid white; 
            display: inline-block; 
            padding-bottom: 5px; 
            font-weight: bold;
        }
        .btn-group a { 
            margin: 10px; 
            padding: 12px 25px; 
            border-radius: 25px; 
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <img src="https://lh3.googleusercontent.com/a-/ALV-UjVxMqQwM9rWsOtuUOgDspncYpUHChkl8gPIoz61r8ueOEjDqRhF" alt="Profile Picture">
        <h2>Lakshay</h2>
        <div class="social-icons">
            <a href="https://github.com/lakshay1341"><i class="bi bi-github"></i></a>
            <a href="https://www.linkedin.com/in/lakshay-3a251b2a7/"><i class="bi bi-linkedin"></i></a>
            <a href="mailto:lakshaychaudhary2003@gmail.com"><i class="bi bi-envelope"></i></a>
        </div>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </div>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <div class="hero-content">
            <h1>Lakshay</h1>
            <p>I'm a <span class="dynamic-text">Java & Spring Developer</span></p>
            <div class="btn-group">
                <a href="https://github.com/lakshay1341" class="btn btn-light">GitHub</a>
                <a href="https://www.linkedin.com/in/lakshay-3a251b2a7/" class="btn btn-light">LinkedIn</a>
            </div>
        </div>
    </section>
</body>
</html>
